<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register page</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/register.css" />
  </head>
  <body>
    <form>
      <div class="icon__box">
        <img src="./assets/icons/logo.svg" alt="" />
      </div>

      <h1>Hisob yaratish</h1>

      <p>Ma'lumotlaringizni kiriting</p>

      <div class="inp__box">
        <img src="./assets/icons/user.svg" alt="" />
        <label for="ism">Ism</label>
        <input id="ism" type="text" placeholder="Ismingiz" />
      </div>

      <div class="inp__box">
        <img src="./assets/icons/email.svg" alt="" />
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="email@example.com" />
      </div>

      <div class="inp__box">
        <img src="./assets/icons/password.svg" alt="" />
        <label for="parol">Parol</label>
        <input id="parol" type="password" placeholder="• • • • • • • •" />
        <img class="eye" src="./assets/icons/eye.svg" alt="" />
        <img class="eye__slash" src="./assets/icons/eye-slash.svg" alt="" />
      </div>

      <div class="inp__box">
        <img src="./assets/icons/password.svg" alt="" />
        <label for="parol__check">Parolni tasdiqlang</label>
        <input
          id="parol__check"
          type="password"
          placeholder="• • • • • • • •"
        />
        <img class="eye2" src="./assets/icons/eye.svg" alt="" />
        <img class="eye__slash2" src="./assets/icons/eye-slash.svg" alt="" />
      </div>

      <button>Ro'yxatdan o'tish</button>

      <p>Hisobingiz bormi? <a href="./index.html">Kirish</a></p>
    </form>

    <script src="./js/register.js"></script>
  </body>
</html>
